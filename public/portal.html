<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RichFi</title>

<style>

  :root {

    --blue: #1a56c4;

    --dark: #2b2f3a;

    --green: #3fb54a;

    --green-dark: #349b3e;

    --red: #e0453c;

    --orange: #d97b1f;

    --muted: #6b7280;

    --border: #c9d3e0;
  }

  * { box-sizing: border-box; }

  body {

    margin: 0;
    min-height: 100vh;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    background: #ffffff;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 30px 16px;
  }

  .card {

    width: 100%;
    max-width: 340px;
    position: relative;
    overflow: hidden;
    min-height: 640px;
  }

  .hexbg {

    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 260px;
    background-image:

      radial-gradient(circle at 20% 90%, rgba(59,130,246,0.15) 2px, transparent 2px),

      radial-gradient(circle at 60% 95%, rgba(59,130,246,0.15) 2px, transparent 2px),

      radial-gradient(circle at 85% 80%, rgba(59,130,246,0.15) 2px, transparent 2px);

    background-size: 60px 60px;
    opacity: 0.6;
    pointer-events: none;
    z-index: 0;
  }

  .content { position: relative; z-index: 1; }

  .logo-wrap {
    text-align: center;
    padding: 20px 0 10px;
  }

  .logo-wrap img {
    width: 130px;
    height: auto;

  }

  .status-row {

    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    font-size: 14px;
    color: var(--dark);
    margin: 18px 0;
    font-weight: 600;

  }

  .status-row .val.disconnected { color: var(--red); }

  .status-row .val.connected { color: var(--green); }

  .info-box {

    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 14px;
    text-align: center;
    margin-bottom: 14px;
  }
 
  .info-box .label {

    font-size: 12px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.3px;
    margin-bottom: 6px;
  }

  .info-box .big {

    font-size: 26px;
    font-weight: 700;
    color: var(--dark);
    letter-spacing: 0.5px;
  }

  .info-box .amount-row {

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 15px;
    color: var(--dark);
    margin-top: 10px;
  }

 .info-box .amt {
    font-size: 50px;
    font-weight: 600;
    color: var(--green-dark);
  }
.pay-countdown-text {
  font-size: 28px;
  font-weight: 700;
  color: var(--dark);
}
  .spinner {
    display: inline-block;
    width: 20px; height: 20px;
    border: 3px solid #f59e0b;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .btn {

    display: block;
    width: 100%;
    padding: 13px 10px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-align: center;
    border: none;
    cursor: pointer;
    margin-bottom: 12px;

  }

  .btn-green { background: var(--green); color: #fff; }

  .btn-green:active { background: var(--green-dark); }

  .btn-outline {

    background: #fff;

    border: 1px solid var(--border);

    color: var(--blue);

  }

  .btn-outline.orange { color: var(--orange); }
  .footer-note {

    text-align: center;
    font-size: 11px;
    color: var(--muted);
    margin-top: 30px;
  }

  .footer-note b { color: var(--blue); }

</style>
</head>

<script>

  // ---- CONFIG ----

  const params = new URLSearchParams(window.location.search);
  const mac = params.get("clientmac") || params.get("mac") || "";
  const POLL_MS = 3000;
  const PAYING_POLL_MS = 1000; // faster polling while waiting for a coin

  // WiFi rates are loaded from the RichFi backend

  let RATE_TABLE = [];

  // ---- STATE ----

  // "disconnected" | "connected" | "paying"
  let state = "disconnected";
  let secondsRemaining = 0;
  let payCountdown = 30;
  let totalAmount = 0;
  
  let payingTimer = null;
  let sessionTimer = null;
  let isPaused = false; // add near other state vars
  // Backend time before the current payment session
  let paymentStartSeconds = 0;

  const statusVal = document.getElementById("statusVal");
  const timeBox = document.getElementById("timeBox");
  const payingBox = document.getElementById("payingBox");
  const mainActionBtn = document.getElementById("mainActionBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const timeRemainingEl = document.getElementById("timeRemaining");
  const payCountdownEl = document.getElementById("payCountdown");
  const totalAmountEl = document.getElementById("totalAmount");
  const blockedNoticeEl = document.getElementById("blockedNotice");

  let blockedUntilClient = 0;
  let blockedTimerInterval = null;

  function showBlockedNotice(retryAfterSeconds) {
    blockedUntilClient = Date.now() + retryAfterSeconds * 1000;
    mainActionBtn.disabled = true;
    blockedNoticeEl.style.display = "block";
    updateBlockedNotice();
    clearInterval(blockedTimerInterval);
    blockedTimerInterval = setInterval(updateBlockedNotice, 1000);
  }

  function updateBlockedNotice() {
    const secondsLeft = Math.max(0, Math.ceil((blockedUntilClient - Date.now()) / 1000));
    if (secondsLeft <= 0) {
      clearInterval(blockedTimerInterval);
      blockedNoticeEl.style.display = "none";
      mainActionBtn.disabled = false;
      return;
    }
    const m = Math.floor(secondsLeft / 60);
    const s = secondsLeft % 60;
    blockedNoticeEl.textContent =
      "Too many attempts without inserting a coin. Try again in " + m + "m " + (s < 10 ? "0" : "") + s + "s.";
  }

  function render() {
    if (state === "disconnected") {

      statusVal.textContent = "Disconnected";
      statusVal.className = "val disconnected";
      timeBox.style.display = "none";
      payingBox.style.display = "none";
      mainActionBtn.textContent = "INSERT COIN";
      mainActionBtn.className = "btn btn-green";
      pauseBtn.style.display = "none";

    } 
     else if (state === "connected") {
      statusVal.textContent = isPaused ? "Disconnected" : "Connected";
      statusVal.className = isPaused ? "val disconnected" : "val connected";
      timeBox.style.display = "block";
      payingBox.style.display = "none";
      mainActionBtn.textContent = "INSERT COIN";
      mainActionBtn.className = "btn btn-green";
      pauseBtn.style.display = "block";
      updateTimeDisplay();
    } else if (state === "paying") {

      // Only show "Connected" if the client is actually authorized
      // (existing time remaining, or a coin was just inserted this session).
      // A brand-new user who just clicked INSERT COIN has 0 seconds
      // remaining and must stay "Disconnected" until they actually pay.
      const isAuthorized = secondsRemaining > 0;
      statusVal.textContent = isAuthorized ? "Connected" : "Disconnected";
      statusVal.className = isAuthorized ? "val connected" : "val disconnected";
      timeBox.style.display = "none";
      payingBox.style.display = "block";
      mainActionBtn.textContent = "Done Paying";
      mainActionBtn.className = "btn btn-green";
      pauseBtn.style.display = "none";
      payCountdownEl.textContent = payCountdown;
      totalAmountEl.innerHTML = "&#8369; " + totalAmount;
    }
  }

  function updateTimeDisplay() {
    const h = Math.floor(secondsRemaining / 3600);
    const m = Math.floor((secondsRemaining % 3600) / 60);
    const s = secondsRemaining % 60;
    timeRemainingEl.textContent = h + "hr : " + m + " m : " + s + " s";

  }

  function startSessionCountdown() {
    clearInterval(sessionTimer);
    sessionTimer = setInterval(() => {

      if (secondsRemaining > 0) {
        secondsRemaining--;
        updateTimeDisplay();

      } else {
        clearInterval(sessionTimer);
        state = "disconnected";
        render();
      }
    }, 1000);

  }

  // ---- AUDIO FEEDBACK ----
  // Synthesized two-note "ding" played on coin insertion — no audio file needed.
  let audioCtx = null;
  function playCoinChime() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      const now = audioCtx.currentTime;
      [880, 1320].forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const start = now + i * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.3, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    } catch (e) {
      console.warn("Coin chime failed:", e);
    }
  }

  // Spoken prompt via the browser's built-in text-to-speech.
  function speakInsertCoin() {
    try {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel(); // stop any prior utterance
      const utter = new SpeechSynthesisUtterance("You may now insert coin");
      utter.rate = 1;
      utter.pitch = 1;
      utter.volume = 1;
      window.speechSynthesis.speak(utter);
    } catch (e) {
      console.warn("Speech synthesis failed:", e);
    }
  }

    // ---- ACTIONS ----
  async function startPayment() {

  if (!mac) {
    console.error("No client MAC address found.");
    return;
  }

  try {

    // Tell backend this customer is waiting for a coin
    const response = await fetch(
      "/cgi-bin/pisowifi?action=start_payment&mac=" +
      encodeURIComponent(mac)
    );

    const data = await response.json();

    console.log("Start payment response:", data);

    if (data.status === "blocked") {
      showBlockedNotice(data.retry_after_seconds || 180);
      return;
    }

    if (data.status !== "waiting") {
      console.error("Unable to start payment:", data);
      return;
    }

    // Backend successfully registered this customer
    // as the one waiting for payment.
    state = "paying";
    totalAmount = 0;
    payCountdown = 30;

    render();
    speakInsertCoin();

    console.log(
      "Waiting for coin for client:",
      data.mac
    );

    // Start/restart the 30-second payment countdown
    startPaymentCountdown();

    /*
     * Get the CURRENT backend time.
     * This becomes our baseline.
     */
    const statusResponse = await fetch(
      "/cgi-bin/pisowifi?action=status&mac=" +
      encodeURIComponent(mac)
    );

    const statusData = await statusResponse.json();

    console.log("Payment starting time:", statusData);

    paymentStartSeconds =
      Number(statusData.seconds_remaining) || 0;

    secondsRemaining = paymentStartSeconds;

    /*
     * Enter payment mode
     */
    state = "paying";

    payCountdown = 30;
    totalAmount = 0;

    render();

    console.log(
      "Waiting for coin. Starting seconds:",
      paymentStartSeconds
    );

    startPaymentCountdown();

  } catch (error) {

    console.error(
      "Payment request failed:",
      error
    );
  }
}

async function handleMainAction() {
  if (state === "disconnected" || state === "connected") {
    await startPayment();
    return;
  }

  if (state === "paying") {
    console.log("Done Paying clicked.");
    clearInterval(payingTimer);

    state = secondsRemaining > 0 ? "connected" : "disconnected";

    if (state === "connected") {
      startSessionCountdown();
    }

    render();

    // Tell backend this payment window is closed
    fetch("/cgi-bin/pisowifi?action=end_payment&mac=" + encodeURIComponent(mac))
      .catch(err => console.error("End payment request failed:", err));
  }
}

    function startPaymentCountdown() {
    clearInterval(payingTimer);

    payCountdown = 30;
    payCountdownEl.textContent = payCountdown;

    payingTimer = setInterval(() => {

      payCountdown--;

      payCountdownEl.textContent = payCountdown;

    if (payCountdown <= 0) {
      clearInterval(payingTimer);
      console.log("Payment timeout.");

      if (totalAmount > 0) {
        state = "connected";
        startSessionCountdown();
      } else {
        state = secondsRemaining > 0 ? "connected" : "disconnected";
      }

      render();

      // Payment window closed — clear waiting state on backend
      fetch("/cgi-bin/pisowifi?action=end_payment&mac=" + encodeURIComponent(mac))
        .catch(err => console.error("End payment request failed:", err));
    }

    }, 1000);
  }

  function pauseTime() {
  isPaused = true;
  clearInterval(sessionTimer);
  pauseBtn.textContent = "Resume Time";
  pauseBtn.onclick = resumeTime;
  render();

  fetch("/cgi-bin/pisowifi?action=pause&mac=" + encodeURIComponent(mac))
    .catch(err => console.error("Pause request failed:", err));
}

function resumeTime() {
  isPaused = false;
  startSessionCountdown();
  pauseBtn.textContent = "Pause Time";
  pauseBtn.onclick = pauseTime;
  render();

  fetch("/cgi-bin/pisowifi?action=resume&mac=" + encodeURIComponent(mac))
    .catch(err => console.error("Resume request failed:", err));
}

  function showRates() {
    loadRates().then(() => {
      const list = document.getElementById("ratesList");
      list.innerHTML = RATE_TABLE.map(t =>
        '<div style="border:1px solid var(--border); border-radius:8px; padding:12px; text-align:center; margin-bottom:10px; color:var(--dark); font-weight:600; font-size:14px;">' + t.label + '</div>'
      ).join("");
      document.getElementById("ratesOverlay").style.display = "flex";
    });
  }

  function hideRates() {

    document.getElementById("ratesOverlay").style.display = "none";

  }

// ----- New load Rates not hardcoded ---- 

async function loadRates() {
  try {
    const response = await fetch("/cgi-bin/pisowifi?action=rates");
    const data = await response.json();
    if (data.status === "ok") {
      RATE_TABLE = data.rates;
    }
  } catch (error) {
    console.error("Failed to load rates:", error);
  }
}

  // ---- REAL POLLING (once wired to opennds/router) ----


async function checkStatus() {
  if (!mac) {
    console.warn("No client MAC found.");
    return;
  }

  try {
    const response = await fetch(
      "/cgi-bin/pisowifi?action=status&mac=" +
      encodeURIComponent(mac)
    );

    const data = await response.json();

    console.log("Status:", data);

    // ==========================================
    // CUSTOMER HAS ACTIVE WIFI TIME
    // ==========================================
    if (data.status === "authorized" && data.seconds_remaining > 0) {

        // Sync pause state from backend — source of truth, survives refresh
        if (data.is_paused !== isPaused) {
          isPaused = data.is_paused;
          if (isPaused) {
            clearInterval(sessionTimer);
            pauseBtn.textContent = "Resume Time";
            pauseBtn.onclick = resumeTime;
          } else {
            pauseBtn.textContent = "Pause Time";
            pauseBtn.onclick = pauseTime;
          }
        }

        if (!isPaused) {
          secondsRemaining = data.seconds_remaining;
        }

        if (state === "paying") {
          const newTotal = typeof data.payment_total === "number" ? data.payment_total : totalAmount;
          if (newTotal > totalAmount) {
            totalAmount = newTotal;
            payCountdown = 30;
            playCoinChime();
          }
          render();
        }  else {
            if (typeof data.payment_total === "number") {
              totalAmount = data.payment_total;
            }
            state = "connected";
            if (!isPaused) {
              secondsRemaining = data.seconds_remaining;
              startSessionCountdown();
            } else {
              secondsRemaining = data.seconds_remaining; // server returns pausedRemaining when paused anyway
            }
            render();
          }
      } else {
      // ==========================================
      // NO ACTIVE WIFI TIME
      // ==========================================
      secondsRemaining = 0;

      if (state !== "paying") {
        state = "disconnected";

        clearInterval(sessionTimer);

        render();
      }
    }

  } catch (error) {
    console.error("Status request failed:", error);
  }

  // Poll faster while actively waiting for a coin so the countdown/total
  // update feels instant; back off to the normal cadence otherwise.
  const nextPollMs = state === "paying" ? PAYING_POLL_MS : POLL_MS;
  setTimeout(checkStatus, nextPollMs);
}

  render();
  loadRates();

  if (mac) {

    checkStatus();

  } else {

    console.warn(
      "No MAC address was provided in the URL."
    );
  }

</script>
